    .backdrop{position:fixed;inset:0;z-index:2000;display:grid;align-items:end;background:rgba(11,35,30,.54);backdrop-filter:blur(5px)}.modal{width:min(100%,620px);max-height:88dvh;margin:0 auto;overflow-y:auto;border-radius:25px 25px 0 0;background:var(--light);box-shadow:var(--shadow)}.preview{display:grid;grid-template-columns:42% 58%;min-height:310px}.preview-art{position:relative;min-height:310px;padding:19px 15px;overflow:hidden}.preview-art .eyebrow{margin-bottom:30px}.preview-art strong{max-width:96%;font-size:clamp(23px,7vw,34px)}.preview-art p{max-width:95%;font-size:12px}.preview-info{position:relative;padding:21px 16px 15px}.close{position:absolute;top:7px;right:8px;z-index:3;display:grid;place-items:center;width:44px;height:44px;border:0;background:transparent;cursor:pointer;font-size:27px}.journey{display:grid;grid-template-columns:1fr 22px 1fr;align-items:center;gap:2px;padding:4px 34px 0 0}.journey div:not(.arrow){display:grid;gap:2px}.meta-label{color:rgba(23,60,52,.48);font-size:8px;font-weight:900;letter-spacing:.11em}.journey strong{overflow:hidden;font-size:10px;text-overflow:ellipsis;white-space:nowrap}.arrow{text-align:center}.modes{display:flex;gap:5px;margin:12px 0 10px;overflow-x:auto}.modes button{min-height:38px;padding:0 9px;border:1px solid var(--line);border-radius:99px;background:transparent;cursor:pointer;font-size:8px;font-weight:800;white-space:nowrap}.modes button.active{background:var(--ink);color:var(--light)}.costs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.costs div{display:grid;gap:2px;padding:7px 5px;border-radius:7px;background:rgba(23,60,52,.06)}.costs strong{font-family:Georgia,serif;font-size:13px}.chips{display:flex;gap:4px;margin:10px 0;overflow-x:auto}.chips span{padding:5px 7px;border:1px solid var(--line);border-radius:99px;font-size:8px;font-weight:900;white-space:nowrap}.invalid{margin:2px 0 8px;color:#a33b2c;font-size:10px}.play{display:flex;align-items:center;justify-content:space-between;width:10       home:{image:'reggio',en:'Your base in Reggio: the safe point that closes every day of the journey.',pl:'Twoja baza w Reggio — bezpieczny punkt, w którym kończy się każdy dzień podróży.',it:'La tua base a Reggio: il punto sicuro in cui si conclude ogni giornata.'},
      museum:{image:'reggio',en:'A focused museum visit built around Calabria’s ancient Mediterranean history and its most iconic archaeological finds.',pl:'Spokojna wizyta poświęcona starożytnej historii śródziemnomorskiej Kalabrii i jej najbardziej rozpoznawalnym znaleziskom.',it:'Una visita dedicata alla storia mediterranea antica della Calabria e ai suoi reperti più riconoscibili.'},
      lungomare:{image:'reggio',en:'The city’s broad waterfront: palms, sea light and open views across the Strait toward Sicily.',pl:'Szerokie miejskie nabrzeże: palmy, morskie światło i otwarty widok przez cieśninę w stronę Sycylii.',it:'Il grande lungomare cittadino: palme, luce marina e viste aperte sullo Stretto verso la Sicilia.'},
      centre:{image:'reggio',en:'A dense walk through central streets, cafés, squares and the stone presence of the Aragonese castle.',pl:'Gęsty spacer przez centralne ulice, kawiarnie, place i kamienną bryłę zamku aragońskiego.',it:'Una passeggiata intensa tra vie centrali, caffè, piazze e la presenza in pietra del castello aragonese.'},

      cathedral:{image:'reggio',en:'The cathedral and its piazza make a natural anchor for exploring the historic heart of Reggio on foot.',pl:'Katedra i jej plac są naturalnym punktem rozpoczęcia pieszego odkrywania historycznego serca Reggio.',it:'Il Duomo e la sua piazza sono un punto naturale da cui esplorare a piedi il cuore storico di Reggio.'},
      mura_terme:{image:'reggio',en:'Two open-air archaeological stops on the waterfront preserve Greek defensive walls and remains of Roman baths with mosaic floors.',pl:'Dwa plenerowe stanowiska przy nabrzeżu zachowały greckie mury obronne oraz pozostałości rzymskich term z mozaikami.',it:'Due siti archeologici all’aperto sul lungomare conservano mura greche e resti di terme romane con pavimenti a mosaico.'},
      pinacoteca:{image:'reggio',en:'A compact civic collection in the historic centre, useful when you want real art without a monumental museum day.',pl:'Kameralna miejska kolekcja w historycznym centrum — prawdziwa sztuka bez konieczności poświęcania całego dnia.',it:'Una raccolta civica compatta nel centro storico, ideale per vedere arte senza dedicare un’intera giornata al museo.'},
      diocesan:{image:'reggio',en:'A small museum beside the cathedral that gives religious objects and local craftsmanship room to be seen slowly.',pl:'Niewielkie muzeum obok katedry, w którym można spokojnie obejrzeć sztukę sakralną i lokalne rzemiosło.',it:'Un piccolo museo accanto al Duomo dove osservare con calma arte sacra e artigianato locale.'},
      pasquino:{image:'reggio',en:'A municipal culture palace with twentieth-century works and the Piccolo Museo San Paolo; the official listing gives a modest €2 ticket.',pl:'Miejski pałac kultury ze sztuką XX wieku i Piccolo Museo San Paolo; oficjalna strona podaje skromny bilet za 2 €.',it:'Un palazzo civico con opere del Novecento e il Piccolo Museo San Paolo; la scheda ufficiale indica un biglietto di 2 €.'},
      planetarium:{image:'reggio',en:'The city planetarium sits above the central grid near Parco Mirella Carbone and runs a changing programme of public astronomy events.',pl:'Miejskie planetarium leży ponad centrum, przy Parco Mirella Carbone, i prowadzi zmienny program publicznych wydarzeń astronomicznych.',it:'Il planetario cittadino si trova sopra il centro, vicino al Parco Mirella Carbone, con un programma variabile di eventi astronomici.'},
      pentimele:{image:'north',en:'Historic hill forts above the northern city make the terrain part of the visit: a sustained climb followed by a broad view across the Strait.',pl:'Historyczne forty na wzgórzach nad północną częścią miasta sprawiają, że podejście jest częścią wizyty — nagrodą jest panorama cieśniny.',it:'I fortini storici sulle colline a nord rendono la salita parte della visita, ricompensata da un ampio panorama sullo Stretto.'},
      nonna_lucia:{image:'reggio',en:'A central trattoria focused on familiar Calabrian dishes rather than formal dining. Review platforms currently place a typical meal around €28.',pl:'Centralna trattoria nastawiona na znajome dania kalabryjskie, a nie formalną kolację. Serwisy z opiniami podają obecnie około 28 € za posiłek.',it:'Una trattoria centrale dedicata ai piatti calabresi familiari più che alla ristorazione formale. Le piattaforme indicano oggi circa 28 € a pasto.'},
      vie_gusto:{image:'reggio',en:'A family-run central restaurant known for Calabrian cooking and generous fixed-menu meals. Clarify the format and final price before ordering.',pl:'Rodzinny lokal w centrum znany z kuchni kalabryjskiej i obfitych menu stałych. Przed zamówieniem warto ustalić wariant i cenę końcową.',it:'Un locale familiare in centro noto per la cucina calabrese e i menu fissi abbondanti. Conviene chiarire formula e prezzo finale prima di ordinare.'},
      luppinari:{image:'north',en:'A modest seafood osteria on the Pentimele side of town, listed for local, short-supply-chain cooking at an indicative average near €22.',pl:'Skromna rybna osteria po stronie Pentimele, opisywana jako lokalna kuchnia z krótkiego łańcucha dostaw, ze średnią w pobliżu 22 €.',it:'Una semplice osteria di mare sul lato di Pentimele, descritta per cucina locale a filiera corta con media indicativa intorno a 22 €.'},
      villa:{image:'north',en:'A harbour town facing the narrow Strait, with constant movement on the water and close views of Sicily.',pl:'Portowe miasto zwrócone ku wąskiej cieśninie, z ciągłym ruchem na wodzie i bliskim widokiem Sycylii.',it:'Una città portuale affacciata sul tratto più stretto, con movimento continuo sull’acqua e la Sicilia vicina.'},
      scilla:{image:'north',en:'A dramatic cliff, a working fishing quarter and a beach sit together in one compact coastal destination.',pl:'Dramatyczny klif, rybacka dzielnica i plaża spotykają się w jednym zwartym nadmorskim miejscu.',it:'Una rupe spettacolare, un quartiere di pescatori e la spiaggia convivono in una destinazione compatta.'},
      bagnara:{image:'north',en:'A steep coastal town for a slower day of sea views, beach time and food connected with local fishing.',pl:'Strome nadmorskie miasto na powolny dzień z widokami, plażą i jedzeniem związanym z lokalnym rybołówstwem.',it:'Una città costiera ripida per una giornata lenta tra panorami, spiaggia e cucina legata alla pesca locale.'},
      messina:{image:'north',en:'The ferry crossing is part of the experience, leading into a compact Sicilian waterfront and city centre.',pl:'Przeprawa promem jest częścią doświadczenia i prowadzi wprost na sycylijskie nabrzeże oraz do centrum miasta.',it:'La traversata in traghetto è parte dell’esperienza e conduce al lungomare siciliano e al centro cittadino.'},
      catona:{image:'north',en:'A nearby stretch of coast with a broad beach, an easy pace and clear views back across the Strait.',pl:'Bliski odcinek wybrzeża z szeroką plażą, spokojnym rytmem i czystym widokiem przez cieśninę.',it:'Un tratto di costa vicino con spiaggia ampia, ritmo tranquillo e viste limpide attraverso lo Stretto.'},
      gallico:{image:'north',en:'One of the easiest sea escapes from home, suited to swimming, a long walk and an unhurried sunset.',pl:'Jeden z najłatwiejszych wypadów nad morze z domu — na kąpiel, długi spacer i spokojny zachód słońca.',it:'Una delle fughe al mare più semplici da casa, adatta a bagno, lunga passeggiata e tramonto tranquillo.'},
      pellaro:{image:'hinterland',en:'The southern edge of Reggio opens into wind, low coastline and wide views toward the Ionian side.',pl:'Południowy skraj Reggio otwiera się na wiatr, niskie wybrzeże i szerokie widoki w stronę Morza Jońskiego.',it:'Il margine sud di Reggio si apre al vento, alla costa bassa e alle ampie vedute verso lo Ionio.'},
      melito:{image:'hinterland',en:'A manageable southern excursion with a long shoreline, open horizons and a noticeably slower rhythm.',pl:'Przystępna wycieczka na południe z długą linią brzegu, otwartym horyzontem i wyraźnie wolniejszym rytmem.',it:'Un’escursione accessibile verso sud, con costa lunga, orizzonti aperti e un ritmo decisamente più lento.'},
      saline:{image:'hinterland',en:'A small coastal wetland beside the railway and an uncanny industrial shoreline; the contrast makes this a genuinely less-obvious excursion.',pl:'Niewielkie nadmorskie mokradło obok linii kolejowej i osobliwego przemysłowego brzegu — kontrast tworzy naprawdę nieoczywistą wycieczkę.',it:'Una piccola zona umida costiera accanto alla ferrovia e a un litorale industriale straniante: un contrasto davvero poco ovvio.'},
      pentedattilo:{image:'hinterland',en:'A stone village set beneath a hand-shaped rock formation, rewarding a full visit rather than a quick stop.',pl:'Kamienna osada pod formacją skalną przypominającą dłoń, która zasługuje na pełną wizytę zamiast szybkiego postoju.',it:'Un borgo di pietra sotto una formazione rocciosa a forma di mano, da vivere con calma e non come breve sosta.'},

      $('todayButton').innerHTML=`${t.day(state.day)} <span>${today.length?t.played(today.length):t.none}</span>`;$('undoButton').textContent=t.undo;$('undoButton').classList.toggle('hidden',!previous);$('endDay').textContent=state.day===WEEK_DAYS?t.endWeek:t.end;$('endDay').classList.toggle('locked',state.location!=='home');
      $('parametersLabel').textContent=t.parameters;$('expTotal').textContent=totalExp();$('dnaSummary').textContent=tops.length?tops.map(([key,value])=>`${t.score[key]} ${value}`).join(' · '):t.noExp;
      $('returnEyebrow').textContent=t.returnEyebrow;$('returnTitle').textContent=t.returnTitle;$('returnCost').textContent=homePlan.total?t.returnCost(homePlan.total):t.alreadyHome;$('returnHomeCard').classList.toggle('at-home',state.location==='home');
      $('selectedPlaceLabel').textContent=t.to;$('selectedPlaceName').textContent=focus.name;$('selectedTravelLabel').textContent=t.travel;$('selectedTravel').textContent=destinationPlan.travel?duration(destinationPlan.travel):'—';$('selectedHomeLabel').textContent=t.returnAt;$('selectedHome').textContent=state.focusLocation==='home'?'—':time(destinationPlan.returnAt);
      $('handTitle').textContent=t.hand(focus.short);$('swipeLabel').textContent=t.swipe(visible.length);$('layerToggle').textContent=terrain?t.detail:t.terrain;$('overview').title=t.overview;$('openArchive').title=t.archive;$('openArchive').setAttribute('aria-label',t.archive);$('offlineNotice').textContent=t.offline;
      $('cardRail').innerHTML=visible.length?visible.map((c,i)=>{const x=ct(c),photo=cardPhoto(c,c.target);return`<button class="card has-photo ${c.tone}" data-card="${c.id}"><img class="card-photo" src="${photo.src}" data-remote="${photo.remote}" data-fallback="${photo.fallback}" onerror="if(this.dataset.remote){this.src=this.dataset.remote;this.dataset.remote=''}else{this.onerror=null;this.src=this.dataset.fallback}" alt=""><span class="num">${String(i+1).padStart(2,'0')}</span><span class="eyebrow">${x[0]}</span><strong>${x[1]}</strong><p>${x[2]}</p><span class="cost">${duration(c.duration)} ${t.activityWord}</span></button>`}).join(''):`<div class="no-place-cards">${t.choose}</div>`;document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>selectCard(b.dataset.card));drawMap();if(!startRequired)save()
    }
    function selectCard(id){if(state.finished){showWeekSummary();return}selected=cardBy(id);const modes=routeModes(state.location,selected.target||state.location);mode=modes[0];setNotice(tr().preview(ct(selected)[1]));openPreview();drawMap()}
    function selectReturn(){if(state.location==='home'){setNotice(tr().alreadyHome);return}selected={...returnCard,modes:returnModes(state.location)};const plan=returnPlan(state.location);mode=plan.mode;setNotice(tr().preview(ct(selected)[1]));openPreview();drawMap()}
    function openPreview(){const t=tr(),x=ct(selected),origin=lt(state.location),timing=cardTiming(selected,mode),dest=lt(timing.destination),modeOptions=selected.isReturn?returnModes(state.location):routeModes(state.location,timing.destination),activityLabel=selected.isReturn?t.settle:t.activity,photo=cardPhoto(selected,timing.destination);
      $('previewModal').innerHTML=`<div class="preview-art ${selected.tone}"><img src="${photo.src}" data-remote="${photo.remote}" data-fallback="${photo.fallback}" onerror="if(this.dataset.remote){this.src=this.dataset.remote;this.dataset.remote=''}else{this.onerror=null;this.src=this.dataset.fallback}" alt="${x[1]}">${photo.href?`<a class="photo-credit" href="${photo.href}" target="_blank" rel="noopener">Wikimedia Commons · source & licence</a>`:''}<span class="eyebrow">${x[0]}</span><strong>${x[1]}</strong><p>${x[2]}</p></div><div class="preview-info"><button class="close" id="closePreview" aria-label="Close">×</button><div class="journey"><div><span class="meta-label">${t.from}</span><strong>${origin.short}</strong></div><div class="arrow">→</div><div><span class="meta-label">${t.to}</span><strong>${dest.short}</strong></div></div>${modeOptions.length&&timing.destination!==state.location?`<div class="modes">${modeOptions.map(m=>`<button data-mode="${m}" class="${m===mode?'active':''}">${t.modes[m]} · ${duration(travelTime(state.location,timing.destination,m))}</button>`).join('')}</div>`:''}<div class="place-copy"><span>${placeAboutLabel()}</span><strong>${dest.name}</strong><p>${placeDescription(timing.destination)}</p></div><div class="costs"><div><span class="meta-label">${t.travel}</span><strong>${timing.travelMinutes?duration(timing.travelMinutes):'—'}</strong></div><div><span class="meta-label">${activityLabel}</span><strong>${duration(selected.duration)}</strong></div><div><span class="meta-label">${t.finish}</span><strong>${time(timing.finish)}</strong></div></div><div class="home-safety"><div><span>${t.homeReserve}</span><strong>${timing.reserve?duration(timing.reserve):'—'}</strong></div><div><span>${t.homeBy}</span><strong>${time(timing.homeBy)}</strong></div></div><div class="chips">${Object.entries(selected.score).map(([k,v])=>`<span>${t.score[k]} +${v}</span>`).join('')}</div>${timing.can?'':`<p class="invalid">${timing.finish>DAY_END?t.late:t.noReturnTime}</p>`}<button class="play" id="playCard" ${timing.can?'':'disabled'}>${t.play}<b>→</b></button></div>`;
      $('previewBackdrop').classList.remove('hidden');$('closePreview').onclick=closePreview;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;openPreview()});$('playCard').onclick=playCard}
    function closePreview(){selected=null;mode=null;$('previewBackdrop').classList.add('hidden');drawMap()}
    function playCard(){if(!selected||state.finished)return;const t=tr(),timing=cardTiming(selected,mode);if(!timing.can)return;previous=JSON.parse(JSON.stringify(state));const card=selected,name=ct(card)[1];state.played.push({id:card.id+'-'+Date.now(),card:card.id,date:state.date,day:state.day,origin:state.location,destination:timing.destination,mode,start:state.minute,arrival:state.minute+timing.travelMinutes,end:timing.finish});state.minute=timing.finish;state.location=timing.destination;state.focusLocation=timing.destination;Object.entries(card.score).forEach(([k,v])=>state.score[k]+=v);closePreview();setNotice(t.moved(name,lt(timing.destination).short));render();map.flyTo([locs[timing.destination].lat,locs[timing.destination].lng],Math.max(map.getZoom(),10.5),{duration:1.15})}
    function undo(){if(!previous)return;state=previous;previous=null;selected=null;setNotice(tr().undone);render()}
    function endDay(){if(state.finished){showWeekSummary();return}if(state.location!=='home'){setNotice(tr().returnFirst);selectReturn();return}previous=JSON.parse(JSON.stringify(state));if(state.day===WEEK_DAYS){state.finished=true;previous=null;selected=null;render();showWeekSummary();return}state.date=addDays(state.startDate,state.day);state.day++;state.minute=DAY_START;state.focusLocation=cards[0].target;selected=null;setNotice(tr().newDay(lt(state.location).short,state.day));render();overview()}
    function showTimeline(){const t=tr(),today=state.played.filter(p=>p.date===state.date);$('timelineModal').innerHTML=`<div class="modal-head"><div><span>${t.route}</span><h2>${dateLabel()}</h2></div><button id="closeTimeline">×</button></div>${today.length?`<ol>${today.map(p=>{const c=cardBy(p.card),x=ct(c);return`<li><time>${time(p.start)}</time><div><strong>${x[1]}</strong><span>${lt(p.origin).short} → ${lt(p.destination).short} · ${t.finish.toLowerCase()} ${time(p.end)}</span></div></li>`}).join('')}</ol>`:`<div class="empty"><b>08:00</b><p>${t.empty}</p></div>`}<div class="scores">${Object.entries(state.score).map(([k,v])=>`<div><span>${t.score[k]}</span><strong>${v}</strong></div>`).join('')}</div><button class="secondary" id="backMap">${t.back}</button>`;$('timelineBackdrop').classList.remove('hidden');$('closeTimeline').onclick=$('backMap').onclick=()=>$('timelineBackdrop').classList.add('hidden')}
    function showStats(){const t=tr(),max=Math.max(5,...Object.values(state.score));$('statsModal').innerHTML=`<div class="modal-head"><div><span>${t.parameters}</span><h2>${t.statsTitle}</h2></div><button id="closeStats">×</button></div><div class="exp-total"><span>${t.totalExp}</span><strong>${totalExp()}</strong></div><div class="stat-list">${Object.entries(state.score).map(([key,value])=>`<div class="stat-row"><span>${t.score[key]}</span><div class="stat-bar"><i style="width:${value/max*100}%"></i></div><strong>${value}</strong></div>`).join('')}</div><button class="secondary" id="backStats">${t.back}</button>`;$('statsBackdrop').classList.remove('hidden');$('closeStats').onclick=$('backStats').onclick=()=>$('statsBackdrop').classList.add('hidden')}
    function cardName(game,id){const saved=game.titles&&game.titles[id]&&game.titles[id][language],card=cardBy(id);return saved||(card&&cardText[card.id]?ct(card)[1]:id)}
    function shortPlace(id){return locs[id]?lt(id).short:id}
    function rankingHTML(currentId=''){const t=tr(),games=rankedGames();if(!games.length)return`<div class="empty"><b>★</b><p>${t.noGames}</p></div>`;return`<div class="ranking">${games.map((game,index)=>`<button class="rank-row ${game.id===currentId?'current':''}" data-history="${game.id}"><span>${index+1}</span><div><strong>${formatDate(game.startDate)} — ${formatDate(game.endDate||addDays(game.startDate,6))}</strong><small>${t.daysPlanned(activitiesOf(game).length)} · ${visitedOf(game)} ${t.placesVisited.toLowerCase()}</small></div><b>${expOf(game)} XP</b></button>`).join('')}</div>`}
    function bindRankingRows(){document.querySelectorAll('[data-history]').forEach(button=>button.onclick=()=>showArchivedGame(button.dataset.history,1))}
    function showArchive(){const t=tr();$('statsModal').innerHTML=`<div class="modal-head"><div><span>${t.archive}</span><h2>${t.ranking}</h2></div><button id="closeArchive">×</button></div>${rankingHTML()}<button class="secondary" id="backArchive">${t.back}</button>`;$('statsBackdrop').classList.remove('hidden');$('closeArchive').onclick=$('backArchive').onclick=()=>$('statsBackdrop').classList.add('hidden');bindRankingRows()}
    function historyItems(game,day){const t=tr(),items=(game.played||[]).filter(p=>Number(p.day)===day).sort((a,b)=>a.start-b.start);return items.length?`<ol>${items.map(p=>`<li><time>${time(p.start)}</time><div><strong>${cardName(game,p.card)}</strong><span>${shortPlace(p.origin)} → ${shortPlace(p.destination)} · ${p.mode&&t.modes[p.mode]?t.modes[p.mode]+' · ':''}${t.finish.toLowerCase()} ${time(p.end)}</span></div></li>`).join('')}</ol>`:`<div class="empty"><b>${String(day).padStart(2,'0')}</b><p>${t.empty}</p></div>`}
    function showArchivedGame(id,day=1){const t=tr(),game=archive.find(item=>item.id===id);if(!game){showArchive();return}day=Math.max(1,Math.min(WEEK_DAYS,Number(day)||1));$('statsModal').innerHTML=`<div class="modal-head"><div><span>${t.historyTitle}</span><h2>${formatDate(game.startDate)} — ${formatDate(game.endDate||addDays(game.startDate,6))}</h2></div><button id="closeHistory">×</button></div><div class="history-summary"><span>${t.expLabel(expOf(game))}</span><span>${t.daysPlanned(activitiesOf(game).length)}</span><span>${visitedOf(game)} ${t.placesVisited.toLowerCase()}</span></div><div class="day-tabs">${Array.from({length:WEEK_DAYS},(_,i)=>`<button data-history-day="${i+1}" class="${day===i+1?'active':''}">${i+1}</button>`).join('')}</div><div class="week-hero"><span>${t.day(day)}</span><h2>${formatDate(addDays(game.startDate,day-1),true)}</h2></div>${historyItems(game,day)}<button class="secondary history-back" id="backRanking">${t.ranking}</button>`;$('statsBackdrop').classList.remove('hidden');$('closeHistory').onclick=()=>$('statsBackdrop').classList.add('hidden');$('backRanking').onclick=showArchive;document.querySelectorAll('[data-history-day]').forEach(button=>button.onclick=()=>showArchivedGame(id,button.dataset.historyDay))}
    function showWeekSummary(){archiveFinishedGame();const t=tr(),activities=state.played.filter(p=>p.card!=='return-home'),visited=new Set(activities.map(p=>p.destination)),top=topStats()[0],max=Math.max(5,...Object.values(state.score));$('statsModal').innerHTML=`<div class="week-hero"><span>${t.weekComplete}</span><h2>${t.weekTitle}</h2></div><div class="exp-total"><span>${t.totalExp}</span><strong>${totalExp()}</strong></div><div class="week-grid"><div><span>${t.activitiesDone}</span><strong>${activities.length}</strong></div><div><span>${t.placesVisited}</span><strong>${visited.size}</strong></div><div><span>${t.strongest}</span><strong>${top?t.score[top[0]]:'—'}</strong></div></div><div class="stat-list">${Object.entries(state.score).map(([key,value])=>`<div class="stat-row"><span>${t.score[key]}</span><div class="stat-bar"><i style="width:${value/max*100}%"></i></div><strong>${value}</strong></div>`).join('')}</div><div class="modal-head"><div><span>${t.archive}</span><h2>${t.ranking}</h2></div></div>${rankingHTML(state.gameId)}<div class="week-actions"><button class="play" id="newWeek">${t.startAgain}<b>→</b></button><button class="secondary" id="closeWeek">${t.back}</button></div>`;$('statsBackdrop').classList.remove('hidden');$('closeWeek').onclick=()=>$('statsBackdrop').classList.add('hidden');$('newWeek').onclick=()=>openStartDialog(false,false);bindRankingRows()}
    function renderStartDialog(){const t=tr(),end=addDays(pendingStartDate,WEEK_DAYS-1);$('startModal').innerHTML=`<div class="modal-head"><div><span>REGGIO QUEST · 7 DAYS</span><h2>${t.startTitle}</h2></div>${startRequired?'':'<button id="closeStart">×</button>'}</div><p>${t.startCopy}</p><form class="start-form" id="startForm"><label>${t.firstDay}<input id="startDate" type="date" required value="${pendingStartDate}"></label><div class="date-span"><div><span>${t.firstDay}</span><strong id="startDateText">${formatDate(pendingStartDate,true)}</strong></div><b>→</b><div><span>${t.lastDay}</span><strong id="endDateText">${formatDate(end,true)}</strong></div></div><button class="play" type="submit">${t.begin}<b>→</b></button>${startRequired?'':`<button class="secondary" type="button" id="cancelStart">${t.cancel}</button>`}</form>`;$('startDate').oninput=e=>{if(!e.target.value)return;pendingStartDate=e.target.value;$('startDateText').textContent=formatDate(pendingStartDate,true);$('endDateText').textContent=formatDate(addDays(pendingStartDate,WEEK_DAYS-1),true)};$('startForm').onsubmit=e=>{e.preventDefault();beginNewGame()};if(!startRequired){$('closeStart').onclick=$('cancelStart').onclick=closeStartDialog}}
    function openStartDialog(ask=true,required=false){if(ask&&!confirm(tr().confirm))return;pendingStartDate=todayISO();startRequired=required;startDialogOpen=true;renderStartDialog();$('startBackdrop').classList.remove('hidden')}
    function closeStartDialog(){if(startRequired)return;startDialogOpen=false;$('startBackdrop').classList.add('hidden')}
    function beginNewGame(){state=newState(pendingStartDate);startRequired=false;startDialogOpen=false;previous=null;selected=null;mode=null;$('startBackdrop').classList.add('hidden');$('statsBackdrop').classList.add('hidden');setNotice(tr().newGame);render();overview()}
    document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{language=b.dataset.lang;setNotice(copy[language].choose);render();if(startDialogOpen)renderStartDialog();else if(state.finished)showWeekSummary()});$('newGame').onclick=()=>openStartDialog(true,false);$('undoButton').onclick=undo;$('endDay').onclick=endDay;$('returnHomeCard').onclick=selectReturn;$('openStats').onclick=showStats;$('openArchive').onclick=showArchive;$('openTimeline').onclick=$('todayButton').onclick=showTimeline;$('overview').onclick=overview;$('layerToggle').onclick=()=>setLayer(!terrain);$('previewBackdrop').onclick=e=>{if(e.target===$('previewBackdrop'))closePreview()};$('timelineBackdrop').onclick=e=>{if(e.target===$('timelineBackdrop'))$('timelineBackdrop').classList.add('hidden')};$('statsBackdrop').onclick=e=>{if(e.target===$('statsBackdrop'))$('statsBackdrop').classList.add('hidden')};$('startBackdrop').onclick=e=>{if(e.target===$('startBackdrop'))closeStartDialog()};
    initMap();setNotice(tr().choose);render();setTimeout(()=>{map.invalidateSize();if(state.finished)showWeekSummary();else if(startRequired)openStartDialog(false,true)},100);
  })();
